name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Validate repository contents
        run: python3 .github/scripts/validate.py
      - name: Disclosure firewall (public tree carries the format, never the mechanism)
        run: python3 .github/scripts/firewall_check.py
      - name: Every sample label agrees with the rules that grade it
        run: python3 .github/scripts/sample_label_check.py
      - name: Grade floor corpus regenerates byte for byte
        run: |
          python3 gen_cases.py
          git diff --exit-code -- grade-floor
      - name: Grade floor corpus appraises as published
        run: python3 grade_floor.py grade-floor/cases/
      - name: Check that linked repositories are public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_links.py
